<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Popup</title>
  <style>
    body {
      min-width: 200px;
      padding: 15px;
      font-family: sans-serif;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>My Extension</h3>
  <button id="clickBtn">Click Me</button>
  <script>
    document.getElementById('clickBtn').addEventListener('click', () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        chrome.scripting.executeScript({
          target: { tabId: tabs[0].id },
          func: () => {
            alert('Button clicked from popup!');
          }
        });
      });
    });
  </script>
</body>
</html>
